<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Santiniketan Online</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --brand-red: #E02438;
      --bg-white: #FFFFFF;
      --text-black: #111111;
      --text-gray: #444444;
      --border-color: #E5E5E5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-white);
      color: var(--text-black);
      line-height: 1.6;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Prevents single word lines (widows) in modern browsers */
    h1, h2, h3, p, li {
      text-align: left;
      text-wrap: pretty;
    }

    /* --- Navbar Styling --- */
    header {
      background-color: var(--bg-white);
      border-bottom: 2px solid var(--brand-red);
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .home-link-left {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-black);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .brand-right {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--brand-red);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
      justify-content: flex-start;
    }

    .nav-links a {
      color: var(--text-gray);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .nav-links a.highlight {
      color: var(--brand-red);
    }

    /* --- Main Content Styling --- */
    main {
      flex: 1;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .card {
      border-bottom: 2px solid var(--border-color);
      padding: 1.5rem 0;
      margin-bottom: 1rem;
    }

    .card:last-child {
      border-bottom: none;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-black);
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }

    h2 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-black);
      margin-bottom: 0.8rem;
    }

    p {
      margin-bottom: 1rem;
      font-size: 1.05rem;
      color: var(--text-gray);
    }

    a {
      color: var(--brand-red);
      font-weight: 700;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    a:hover {
      text-decoration: underline;
      opacity: 0.8;
    }

    .ig-box {
      padding: 1.2rem;
      background-color: #F9F9F9;
      border-left: 4px solid var(--brand-red);
      margin: 1.5rem 0;
    }

    .ig-button {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1.5rem;
      background-color: var(--text-black);
      color: var(--bg-white);
      font-weight: 800;
      border-radius: 8px;
      margin-top: 1rem;
      text-decoration: none;
    }

    .ig-button:hover {
      text-decoration: none;
    }

    /* --- Footer Styling --- */
    footer {
      background-color: var(--bg-white);
      border-top: 1px solid var(--border-color);
      padding: 2rem 1.5rem;
      text-align: left;
      color: var(--text-gray);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .footer-time {
      color: var(--brand-red);
      font-weight: 800;
      margin-top: 0.5rem;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.7rem; }
      h2 { font-size: 1.2rem; }
      main { padding: 1.5rem 1rem; }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header>
    <div class="top-bar">
      <a href="#home" class="home-link-left">Home</a>
      <a href="#home" class="brand-right">Santiniketan Online</a>
    </div>
    <nav class="nav-links">
      <a href="#about">About</a>
      <a href="#terms">Terms</a>
      <a href="#privacy">Privacy Policy</a>
      <a href="#soa" class="highlight">Join SOA</a>
    </nav>
  </header>

  <!-- Dynamic Content Area -->
  <main id="app-content"></main>

  <!-- Footer -->
  <footer>
    <p>© Santiniketan Online. All Rights Reserved.</p>
    <p class="footer-time" id="clock"></p>
  </footer>

  <!-- Hash Router and Logic -->
  <script>
    // Define the content for each page
    const pages = {
      home: `
        <h1>Latest Incident & Analysis</h1>
        <div class="card">
          <h2>Recent Investigation</h2>
          <p>Real-time incident updates are published strictly via our official Instagram handle.</p>
          <div class="ig-box">
            <p style="margin: 0; font-weight: 700; color: #111111;">Official Post Source:</p>
            <a href="https://www.instagram.com/thesantiniketan" target="_blank" rel="noopener noreferrer" style="display: inline-block; margin-top: 0.5rem;">
              View Live Story & Evidence on Instagram (@thesantiniketan)
            </a>
          </div>
          <h2>Incident Brief & Ground Analysis</h2>
          <p>This section contains detailed breakdowns and legal clarifications regarding the latest reported incident across Visva Bharati and Santiniketan.</p>
          <p>No past archive is stored on this static page. All historical coverage remains securely accessible via our official Instagram timeline.</p>
        </div>
      `,
      about: `
        <h1>About Us</h1>
        <div class="card">
          <p style="font-size: 1.15rem; color: #111111; font-weight: 700;">
            Made and run by an anonymous vigilant who thought the University and Santiniketan must be free of mischievous behaviour, corruption, crime, and nepotism.
          </p>
          <p style="margin-top: 2rem; color: #E02438; font-weight: 800;">
            — From CEO, Santiniketan Online
          </p>
        </div>
      `,
      terms: `
        <h1>Terms of Service</h1>
        <div class="card">
          <h2>Warning on Joining SOA</h2>
          <p>Becoming a <a href="#soa">Santiniketan Online Agent (SOA)</a> requires adherence to strict verification protocols. Agents must never submit fabricated evidence.</p>
        </div>
        <div class="card">
          <h2>News Credibility & "Allegedly"</h2>
          <p>Unless legally convicted in a court of law, all incidents are published as allegations. The word "allegedly" is strictly enforced to protect all parties legally while maintaining transparency.</p>
        </div>
        <div class="card">
          <h2>Grievances on Instagram DM</h2>
          <p>We try our best to hide your identity when you provide information on something. We refine it in a legal way so that no one can use you. We also reserve the right to reject cases if the incident is not shareable or completely unverified.</p>
        </div>
        <div class="card">
          <h2>Right to Modify</h2>
          <p>We have the right to change our Terms of Service at any given time.</p>
        </div>
      `,
      privacy: `
        <h1>Privacy Policy</h1>
        <div class="card">
          <h2>Data Collection</h2>
          <p>We collect no data that breaches your privacy. This static website does not utilize invasive tracking cookies or IP logging mechanics.</p>
        </div>
        <div class="card">
          <h2>We Keep Privacy of SOA Officers</h2>
          <p>If you operate as a <a href="#soa">Santiniketan Online Agent (SOA)</a>, your identity, internal communications, and submission records are strictly protected and siloed.</p>
        </div>
        <div class="card">
          <h2>No Data Selling</h2>
          <p>We never sell your information to data brokers for profit. Your trust and safety are the foundation of this platform.</p>
        </div>
        <div class="card">
          <h2>Right to Modify</h2>
          <p>We have the right to change the Privacy Policy as necessary to adapt to new legal or structural requirements.</p>
        </div>
      `,
      soa: `
        <h1>Join SOA</h1>
        <div class="card">
          <h2>How SOA Works</h2>
          <p>Santiniketan Online Agents (SOAs) gather vital information about University departments, Santiniketan areas, Hostel issues, Authority negligence, and Nepotism or Corruption.</p>
          <p>They get hired directly on Instagram if they want to work and meet our verification standards. We ensure your information is kept entirely hidden.</p>
        </div>
        <div class="card">
          <h2>Criteria for Joining</h2>
          <p>You must have a good public profile that proves you are a part of this environment. You must also be passionate enough to do the hard work required to verify incidents.</p>
        </div>
        <div class="card">
          <h2>Apply Now</h2>
          <p>If you want to join, DM us directly on Instagram.</p>
          <a href="https://www.instagram.com/thesantiniketan" target="_blank" rel="noopener noreferrer" class="ig-button">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#FFFFFF">
              <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
            Santiniketan Online
          </a>
        </div>
      `
    };

    // The Router Function
    function router() {
      // Get the hash from URL, remove the '#', default to 'home'
      let hash = window.location.hash.substring(1);
      if (!hash || !pages[hash]) {
        hash = 'home';
        window.location.hash = '#home'; // Update URL to reflect home
      }

      // Inject the HTML content
      document.getElementById('app-content').innerHTML = pages[hash];

      // Scroll to the top of the page on route change
      window.scrollTo(0, 0);
    }

    // Run router when hash changes (clicking links) or on initial page load
    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', router);

    // Live Clock Logic (IST)
    function updateClock() {
      const now = new Date();
      const options = {
        timeZone: 'Asia/Kolkata',
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      };
      const formatted = new Intl.DateTimeFormat('en-IN', options).format(now);
      document.getElementById('clock').textContent = formatted + ' IST';
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
